name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pest:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        exclude:
          # Laravel 13 needs PHP 8.3, and Laravel 11 predates PHP 8.5.
          - php: '8.2'
            laravel: '13'
          - php: '8.5'
            laravel: '11'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --with "laravel/framework:^${{ matrix.laravel }}.0"

      - name: Run tests
        run: vendor/bin/pest --ci
